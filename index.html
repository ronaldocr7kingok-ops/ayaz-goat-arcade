<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ayaz Arcade</title>
    <style>
      :root {
        --bg-deep: #070d19;
        --bg-mid: #111d31;
        --panel: rgba(14, 23, 35, 0.72);
        --panel-strong: rgba(31, 38, 48, 0.8);
        --panel-soft: rgba(255,255,255,0.06);
        --border: rgba(255,255,255,0.08);
        --text: #edf5ff;
        --muted: rgba(237,245,255,0.78);
        --soft: rgba(255,255,255,0.4);
        --green: #8ef0b0;
        --yellow: #f7d46e;
        --red: #ff7c7c;
        --blue: #7ec8ff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #000;
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 10%, rgba(87, 128, 180, 0.22), transparent 26%),
          linear-gradient(180deg, #020813 0%, #090f1b 100%);
      }

      .browser-shell {
        position: relative;
        width: min(92vw, 1120px);
        height: min(86vh, 860px);
        background: rgba(9, 16, 25, 0.96);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        box-shadow: 0 26px 60px rgba(0,0,0,0.7);
        overflow: hidden;
      }

      .browser-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle, rgba(255,255,255,0.25) 0.8px, transparent 1px) 0 0 / 18px 18px,
          radial-gradient(circle, rgba(255,255,255,0.18) 1px, transparent 1.3px) 9px 9px / 18px 18px;
        opacity: 0.22;
        pointer-events: none;
      }

      .topbar {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 12px 18px 14px;
        background: rgba(25, 27, 34, 0.7);
        border-bottom: 1px solid rgba(255,255,255,0.07);
      }

      .status-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 180px;
      }

      .time-wrap {
        font-size: 1.05rem;
        letter-spacing: 0.02em;
        font-weight: 700;
        color: rgba(255,255,255,0.9);
      }

      .browser-tools {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
        margin-right: 8px;
      }

      .nav-button {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        background: rgba(255,255,255,0.04);
        color: var(--text);
        font-size: 1.2rem;
        cursor: default;
      }

      .nav-button.back {
        font-size: 1.8rem;
        line-height: 1;
      }

      .address-bar {
        flex: 1;
        max-width: 560px;
        min-width: 180px;
        height: 40px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.06);
        background: rgba(255,255,255,0.05);
        padding: 0 14px;
        margin: 0 auto;
      }

      .url-icon {
        font-size: 1.15rem;
      }

      .url-text {
        flex: 1;
        font-size: 1.1rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .toolbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .tiny-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.08);
        font-size: 0.8rem;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        background: #8ef0b0;
      }

      .toolbar {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 20px 0;
      }

      .browser-tab {
        flex: 1;
        max-width: 260px;
        height: 38px;
        border-radius: 16px 16px 0 0;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255,255,255,0.8);
        font-weight: 700;
        font-size: 0.95rem;
      }

      .browser-tab.active {
        background: rgba(255,255,255,0.08);
      }

      .browser-panel {
        position: relative;
        z-index: 2;
        margin: 8px 26px 24px;
        border-radius: 18px;
        background: rgba(18, 28, 38, 0.58);
        border: 1px solid rgba(255,255,255,0.08);
        padding: 18px 18px 16px;
        min-height: 600px;
      }

      .finder-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        margin-bottom: 20px;
      }

      .finder-pill {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.06);
        color: var(--text);
        font-size: 1.8rem;
      }

      .app-title {
        text-align: center;
        margin: 8px 0 0;
        font-size: clamp(2.8rem, 3vw, 4rem);
        font-weight: 900;
        letter-spacing: 0.02em;
        color: rgba(255,255,255,0.96);
      }

      .app-subtitle {
        text-align: center;
        margin-top: 10px;
        color: rgba(255,255,255,0.72);
        font-size: clamp(1.2rem, 1.7vw, 2rem);
        font-weight: 600;
      }

      .app-grid {
        width: min(730px, 100%);
        margin: 24px auto 0;
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 14px 14px;
      }

      .game-tile {
        position: relative;
        height: 145px;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.08);
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02), 0 12px 18px rgba(0,0,0,0.18);
      }

      .game-tile:nth-child(1) { background: linear-gradient(135deg, #98e77a, #8bc46b); }
      .game-tile:nth-child(2) { background: linear-gradient(135deg, #f1d77a, #ffc35d); }
      .game-tile:nth-child(3) { background: linear-gradient(135deg, #7a75ff, #3092f7); }
      .game-tile:nth-child(4) { background: linear-gradient(135deg, #61c8ff, #7f5aff); }
      .game-tile:nth-child(5) { background: linear-gradient(135deg, #0f7ae4, #4bb5ff); }
      .game-tile:nth-child(6) { background: linear-gradient(135deg, #ff7a62, #ffb565); }
      .game-tile:nth-child(7) { background: linear-gradient(135deg, #8a8cff, #4d62ff); }
      .game-tile:nth-child(8) { background: linear-gradient(135deg, #fd6b8a, #ff9a5d); }

      .tile-face {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-weight: 900;
        color: rgba(255,255,255,0.96);
        text-shadow: 0 6px 20px rgba(0,0,0,0.17);
      }

      .tile-emoji {
        font-size: clamp(2.7rem, 3vw, 4rem);
      }

      .tile-text {
        font-size: clamp(1.1rem, 1.5vw, 1.6rem);
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .tile-text.small {
        font-size: 1rem;
      }

      .search-box {
        width: min(430px, 88%);
        height: 56px;
        margin: 22px auto 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.07);
        color: rgba(255,255,255,0.7);
        font-size: clamp(1rem, 1.4vw, 1.5rem);
        font-weight: 700;
      }

      .footer-bar {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        width: min(540px, 74%);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        font-size: 1rem;
        color: rgba(255,255,255,0.8);
      }

      .online-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }

      .icon-set {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .round-btn {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.05);
        color: var(--text);
        font-size: 1.1rem;
      }

      @media (max-width: 800px) {
        .browser-shell {
          width: 100vw;
          height: 100vh;
          border-radius: 0;
        }

        .address-bar {
          max-width: 320px;
        }

        .app-grid {
          grid-template-columns: repeat(2, minmax(120px, 1fr));
        }

        .browser-panel {
          min-height: auto;
          padding-bottom: 80px;
        }
      }
    </style>
  </head>
  <body>
    <div class="browser-shell">
      <div class="topbar">
        <div class="status-left">
          <div class="time-wrap">9:25 PM</div>
        </div>

        <div class="browser-tools">
          <div class="nav-button back">‹</div>
        </div>

        <div class="address-bar">
          <span class="url-icon">⚙</span>
          <div class="url-text">anv-ims-lms.22web.org</div>
        </div>

        <div class="toolbar-right">
          <div class="tiny-pill"><span class="dot"></span> 56%</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="browser-tab">Music Genres and C...</div>
        <div class="browser-tab active">Google</div>
        <div class="browser-tab">Study.com | Math</div>
        <div class="browser-tab">IXL | Math, Language...</div>
      </div>

      <div class="browser-panel">
        <div class="finder-row">
          <div class="finder-pill">✦</div>
          <div class="finder-pill">＋</div>
          <div class="finder-pill">▣</div>
          <div class="finder-pill">⚙</div>
          <div class="finder-pill">＋</div>
        </div>

        <h1 class="app-title">games</h1>
        <div class="app-subtitle">loaded 224 games...</div>

        <div class="search-box">find what you want...</div>

        <div class="app-grid">
          <div class="game-tile"><div class="tile-face"><span class="tile-emoji">🧩</span></div></div>
          <div class="game-tile"><div class="tile-face"><span class="tile-emoji">🎮</span></div></div>
          <div class="game-tile"><div class="tile-face"><span class="tile-emoji">🌌</span></div></div>
          <div class="game-tile"><div class="tile-face"><span class="tile-emoji">🏔️</span></div></div>
          <div class="game-tile"><div class="tile-face"><span class="tile-emoji">🎯</span></div></div>

          <div class="game-tile"><div class="tile-face"><span class="tile-emoji">🦕</span></div></div>
          <div class="game-tile"><div class="tile-face"><span class="tile-emoji">🚀</span></div></div>
          <div class="game-tile"><div class="tile-face"><span class="tile-emoji">👾</span></div></div>
          <div class="game-tile"><div class="tile-face"><span class="tile-emoji">🎲</span></div></div>
          <div class="game-tile"><div class="tile-face"><span class="tile-emoji">🧠</span></div></div>
        </div>

        <div class="footer-bar">
          <div class="online-badge">online users: 1455</div>
          <div class="icon-set">
            <div class="round-btn">⚙</div>
            <div class="round-btn">◌</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
