<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games</title>
    <style>
      :root {
        --bg-0: #00070d;
        --bg-1: #07101a;
        --bg-2: #111f2b;
        --chrome: rgba(17,22,28,0.9);
        --chrome-2: rgba(255,255,255,0.05);
        --panel: rgba(20,28,38,0.7);
        --text: #eff7ff;
        --muted: rgba(239,247,255,0.7);
        --soft: rgba(255,255,255,0.08);
        --green: #9bf0b2;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #000;
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at center, rgba(123,142,190,0.12), transparent 36%), linear-gradient(180deg, #01070d, #050c17 100%);
      }

      .screen {
        width: min(92vw, 1200px);
        height: min(88vh, 840px);
        background: rgba(12,18,28,0.94);
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.08);
        position: relative;
        overflow: hidden;
        box-shadow: 0 24px 64px rgba(0,0,0,0.75);
      }

      .screen::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle, rgba(255,255,255,0.24) 0.8px, transparent 1.2px) 0 0 / 18px 18px,
          radial-gradient(circle, rgba(255,255,255,0.18) 1px, transparent 1.4px) 9px 9px / 18px 18px;
        opacity: 0.22;
      }

      .header {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        height: 72px;
        padding: 12px 18px 10px;
        background: rgba(25,28,34,0.76);
        border-bottom: 1px solid rgba(255,255,255,0.05);
      }

      .header-left, .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 180px;
      }

      .header-right { justify-content: flex-end; }

      .time {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: rgba(255,255,255,0.92);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 5px 11px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .chip .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        display: block;
      }

      .nav-btn {
        width: 32px;
        height: 32px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.04);
        color: rgba(255,255,255,0.9);
        font-size: 1.8rem;
        line-height: 1;
      }

      .address {
        flex: 1;
        max-width: 560px;
        height: 42px;
        border-radius: 18px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 14px;
        color: rgba(255,255,255,0.9);
        font-weight: 700;
      }

      .address .brand {
        font-size: 1rem;
      }

      .address .url {
        font-size: 1.03rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tabs {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 18px 0;
      }

      .tab {
        flex: 1;
        max-width: 250px;
        height: 38px;
        border-radius: 16px 16px 0 0;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.04);
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255,255,255,0.76);
        font-size: 0.9rem;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tab.active {
        background: rgba(255,255,255,0.08);
      }

      .content {
        position: relative;
        z-index: 2;
        margin: 12px 24px 20px;
        background: rgba(15,24,34,0.64);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        height: calc(100% - 124px);
        min-height: 580px;
        padding: 18px 18px 8px;
      }

      .quick {
        display: flex;
        gap: 16px;
        justify-content: center;
        margin-top: 8px;
      }

      .quick .item {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.07);
        font-size: 1.7rem;
      }

      h1 {
        margin: 26px 0 4px;
        text-align: center;
        font-size: clamp(2.8rem, 3.4vw, 5rem);
        font-weight: 900;
        letter-spacing: 0.02em;
        line-height: 1;
      }

      .sub {
        text-align: center;
        color: rgba(255,255,255,0.72);
        font-size: clamp(1.2rem, 1.8vw, 2rem);
        font-weight: 600;
        margin: 0 0 12px;
      }

      .search-box {
        width: min(440px, 84%);
        height: 52px;
        border-radius: 18px;
        margin: 16px auto 0;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255,255,255,0.72);
        font-size: 1.05rem;
        font-weight: 700;
      }

      .tiles {
        width: min(770px, 90%);
        margin: 22px auto 0;
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 14px 18px;
      }

      .tile {
        position: relative;
        height: 150px;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 12px 20px rgba(0,0,0,0.18);
      }

      .tile:nth-child(1) { background: linear-gradient(135deg, #a0ea79, #7dc95d); }
      .tile:nth-child(2) { background: linear-gradient(135deg, #f0d76f, #f5b956); }
      .tile:nth-child(3) { background: linear-gradient(135deg, #6887ff, #3e69ff); }
      .tile:nth-child(4) { background: linear-gradient(135deg, #70d1ff, #4d8efb); }
      .tile:nth-child(5) { background: linear-gradient(135deg, #3289ff, #5f62f8); }
      .tile:nth-child(6) { background: linear-gradient(135deg, #ffb26b, #ff7b5d); }
      .tile:nth-child(7) { background: linear-gradient(135deg, #8da4ff, #5d71ff); }
      .tile:nth-child(8) { background: linear-gradient(135deg, #fb7c78, #ff9f5b); }
      .tile:nth-child(9) { background: linear-gradient(135deg, #7ec6ff, #49a6ff); }
      .tile:nth-child(10) { background: linear-gradient(135deg, #ff7a8d, #ff7a5f); }

      .tile .inner {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: clamp(2.6rem, 3vw, 4rem);
        color: rgba(255,255,255,0.98);
        text-shadow: 0 8px 20px rgba(0,0,0,0.2);
      }

      .footer {
        position: absolute;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        width: min(560px, 74%);
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: rgba(255,255,255,0.8);
      }

      .count {
        font-weight: 700;
        font-size: 1rem;
      }

      .icons {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .icons .round {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.05);
      }

      @media (max-width: 860px) {
        .screen {
          width: 100vw;
          height: 100vh;
          border-radius: 0;
        }
        .tiles {
          grid-template-columns: repeat(2, minmax(120px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="header">
        <div class="header-left">
          <div class="time">9:25 PM</div>
        </div>

        <div class="nav-btn">‹</div>

        <div class="address">
          <span class="brand">◌</span>
          <span class="url">anv-ims-lms.22web.org</span>
        </div>

        <div class="header-right">
          <div class="chip"><span class="dot"></span>56%</div>
        </div>
      </div>

      <div class="tabs">
        <div class="tab">Music Genres and C...</div>
        <div class="tab active">Google</div>
        <div class="tab">Study.com | Math</div>
        <div class="tab">IXL | Math, Language...</div>
      </div>

      <div class="content">
        <div class="quick">
          <div class="item">✦</div>
          <div class="item">＋</div>
          <div class="item">▣</div>
          <div class="item">⚙</div>
          <div class="item">＋</div>
        </div>

        <h1>games</h1>
        <p class="sub">loaded 224 games...</p>

        <div class="search-box">find what you want...</div>

        <div class="tiles">
          <div class="tile"><div class="inner">🎮</div></div>
          <div class="tile"><div class="inner">🎯</div></div>
          <div class="tile"><div class="inner">🌌</div></div>
          <div class="tile"><div class="inner">🏔️</div></div>
          <div class="tile"><div class="inner">🚀</div></div>

          <div class="tile"><div class="inner">🦕</div></div>
          <div class="tile"><div class="inner">🎲</div></div>
          <div class="tile"><div class="inner">👾</div></div>
          <div class="tile"><div class="inner">🧠</div></div>
          <div class="tile"><div class="inner">🎧</div></div>
        </div>

        <div class="footer">
          <div class="count">online users: 1455</div>
          <div class="icons">
            <div class="round">⚙</div>
            <div class="round">◌</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
