<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ayaz Arcade - 50+ Games</title>
  <style>
    :root {
      --bg-1: #050814;
      --bg-2: #0f172a;
      --panel: rgba(12, 18, 30, 0.74);
      --panel-strong: rgba(18, 25, 38, 0.92);
      --line: rgba(122, 246, 255, 0.16);
      --line-2: rgba(255, 255, 255, 0.12);
      --cyan: #7af6ff;
      --purple: #a58bff;
      --pink: #ff62c9;
      --green: #77f7b0;
      --red: #ff7575;
      --text: #edf6ff;
      --muted: rgba(237, 246, 255, 0.72);
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #020711;
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at 20% 20%, rgba(26, 65, 102, 0.5), transparent 25%),
        radial-gradient(circle at 80% 16%, rgba(120, 86, 255, 0.24), transparent 18%),
        linear-gradient(180deg, #020711 0%, #071420 35%, #020812 100%);
      position: relative;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      opacity: 0.8;
      animation: blink 3s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .orb {
      position: fixed;
      width: 180px;
      height: 180px;
      right: 8%;
      top: 8%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fffde7 0%, #f6ef9b 23%, #d8c55b 50%, #8e7d30 100%);
      box-shadow: 0 0 60px rgba(255, 239, 146, 0.35), inset -26px -14px 30px rgba(0,0,0,0.18);
      z-index: 0;
      animation: float 7s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1200px, 94vw);
      min-height: 86vh;
      margin: 3vh auto;
      background: rgba(7, 12, 22, 0.86);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0,0,0,0.6), 0 0 0 1px rgba(122,246,255,0.06);
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.02), rgba(255,255,255,0.01)),
        radial-gradient(circle, rgba(255,255,255,0.12) 0.8px, transparent 1.2px) 0 0 / 18px 18px;
      opacity: 0.5;
      pointer-events: none;
    }

    .topbar {
      position: relative;
      z-index: 2;
      height: 74px;
      background: rgba(28, 34, 46, 0.8);
      border-bottom: 1px solid var(--line-2);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 22px;
    }

    .time {
      min-width: 100px;
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.92);
    }

    .nav-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      border: 1px solid var(--line-2);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.9);
      font-size: 1.7rem;
      cursor: pointer;
    }

    .address-bar {
      flex: 1;
      max-width: 620px;
      height: 46px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 22px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.8);
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 0 16px;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
    }

    .status {
      min-width: 110px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.88);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(119,247,176,0.9);
    }

    .tabs {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 12px;
      padding: 10px 22px 0;
      overflow-x: auto;
    }

    .tab {
      min-width: 160px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom: none;
      border-radius: 16px 16px 0 0;
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.72);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tab.active {
      background: rgba(255,255,255,0.1);
      color: var(--text);
      border-color: rgba(122,246,255,0.2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .main {
      position: relative;
      z-index: 2;
      margin: 10px 24px 24px;
      background: rgba(15, 22, 34, 0.7);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 22px 20px 18px;
      min-height: 600px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .quick-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .quick-item {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      display: grid;
      place-items: center;
      font-size: 1.7rem;
      color: rgba(255,255,255,0.9);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
    }

    .title {
      text-align: center;
      margin: 22px 0 6px;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1;
      letter-spacing: -0.05em;
      font-weight: 900;
      text-shadow: 0 0 30px rgba(122,246,255,0.12);
    }

    .subtitle {
      text-align: center;
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      font-weight: 600;
    }

    .search {
      display: block;
      width: min(460px, 86%);
      height: 54px;
      margin: 22px auto 8px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.72);
      text-align: center;
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: inset 0 0 16px rgba(255,255,255,0.02);
    }

    .search::placeholder {
      color: rgba(255,255,255,0.4);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .section-label {
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin: 28px 0 14px;
      font-weight: 700;
    }

    .grid {
      width: min(920px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 24px rgba(0,0,0,0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 20px 28px rgba(0,0,0,0.28), 0 0 28px rgba(122,246,255,0.12);
    }

    .card .icon {
      font-size: 3.4rem;
      z-index: 1;
      text-shadow: 0 8px 24px rgba(0,0,0,0.28);
    }

    .card .label {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      z-index: 1;
      text-shadow: 0 4px 12px rgba(0,0,0,0.25);
      text-align: center;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 60%);
      opacity: 0.8;
    }

    /* Game gradients */
    .game-memory { background: linear-gradient(135deg, #67d6ff 0%, #4d5efb 100%); }
    .game-reaction { background: linear-gradient(135deg, #72e6ae 0%, #1ec98a 50%, #1486c8 100%); }
    .game-guess { background: linear-gradient(135deg, #ff8a61 0%, #ff5d6c 45%, #a92cc2 100%); }
    .game-click { background: linear-gradient(135deg, #d57dff 0%, #8b4dff 45%, #4b2d9a 100%); }
    
    .game-drift { background: linear-gradient(135deg, #ff6b6b 0%, #ff8e72 100%); }
    .game-boss { background: linear-gradient(135deg, #ffd93d 0%, #ff6b9d 100%); }
    .game-cookie { background: linear-gradient(135deg, #8b4513 0%, #d2691e 100%); }
    .game-flappy { background: linear-gradient(135deg, #4fc3f7 0%, #2196f3 100%); }
    .game-snake { background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%); }
    .game-tetris { background: linear-gradient(135deg, #00bcd4 0%, #0097a7 100%); }
    .game-pac { background: linear-gradient(135deg, #ffeb3b 0%, #fbc02d 100%); }
    .game-dino { background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%); }
    .game-basketball { background: linear-gradient(135deg, #ff9800 0%, #ff6f00 100%); }
    .game-typing { background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%); }
    .game-piano { background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%); }
    .game-bubble { background: linear-gradient(135deg, #673ab7 0%, #512da8 100%); }
    .game-breakout { background: linear-gradient(135deg, #ff5722 0%, #e64a19 100%); }
    .game-racing { background: linear-gradient(135deg, #009688 0%, #00796b 100%); }
    .game-2048 { background: linear-gradient(135deg, #cddc39 0%, #afb42b 100%); }
    .game-minesweeper { background: linear-gradient(135deg, #757575 0%, #424242 100%); }

    /* App gradients */
    .app-youtube { background: linear-gradient(135deg, #ff3e37 0%, #e4292a 50%, #8c1111 100%); }
    .app-tiktok { background: linear-gradient(135deg, #111827 0%, #1e293b 26%, #00d4ff 55%, #ff2d83 100%); }
    .app-discord { background: linear-gradient(135deg, #5563f7 0%, #4050d0 100%); }
    .app-instagram { background: linear-gradient(135deg, #ffd76b 0%, #fb9f42 18%, #f35f89 43%, #9058ff 100%); }
    .app-google { background: linear-gradient(135deg, #4285f4 0%, #34a853 30%, #fbbc05 60%, #ea4335 100%); }
    .app-twitch { background: linear-gradient(135deg, #7e5bff 0%, #4b2fa6 100%); }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 860px;
      margin: 28px auto 0;
      color: rgba(255,255,255,0.78);
      font-weight: 700;
      padding: 0 10px;
    }

    .footer-icons {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .footer-icons button {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      cursor: pointer;
      font-size: 1.1rem;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(2, 5, 12, 0.8);
      backdrop-filter: blur(8px);
      z-index: 20;
    }

    .modal.open {
      display: grid;
    }

    .modal-box {
      width: min(720px, 92vw);
      min-height: 340px;
      background: rgba(13, 20, 32, 0.96);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      box-shadow: 0 26px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(122,246,255,0.08);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(27,34,48,0.7);
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.02em;
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 1.6rem;
      cursor: pointer;
    }

    .modal-content {
      padding: 24px;
      text-align: center;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(60px, 1fr));
      gap: 12px;
      max-width: 420px;
      margin: 20px auto;
    }

    .mem-card {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      background: linear-gradient(135deg, rgba(64, 82, 121, 0.9), rgba(31, 52, 81, 0.9));
      display: grid;
      place-items: center;
      font-size: 2rem;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .mem-card:hover {
      transform: translateY(-2px);
      border-color: rgba(122,246,255,0.5);
    }

    .mem-card.matched {
      background: linear-gradient(135deg, rgba(70, 173, 117, 0.4), rgba(24, 65, 49, 0.8));
      border-color: rgba(119,247,176,0.6);
    }

    .big-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.18);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 2.4rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 22px auto;
      display: block;
    }

    .big-btn.ready {
      background: linear-gradient(135deg, rgba(119,247,176,0.35), rgba(122,246,255,0.25));
      border-color: rgba(119,247,176,0.6);
      box-shadow: 0 0 30px rgba(119,247,176,0.25);
    }

    .result {
      min-height: 30px;
      font-size: 1.06rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      margin-top: 10px;
    }

    .input-number {
      width: 220px;
      height: 50px;
      text-align: center;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 700;
      margin: 14px auto 10px;
      display: block;
    }

    .action-btn {
      padding: 12px 26px;
      border-radius: 12px;
      border: 1px solid rgba(122,246,255,0.2);
      background: linear-gradient(135deg, rgba(122,246,255,0.2), rgba(165,139,255,0.2));
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    @media (max-width: 860px) {
      .shell {
        width: 100vw;
        height: 100vh;
        margin: 0;
        border-radius: 0;
      }
      .tabs { padding-left: 12px; padding-right: 12px; }
      .tab { min-width: 120px; }
      .grid { grid-template-columns: repeat(2, minmax(100px, 1fr)); }
      .orb { width: 120px; height: 120px; right: 4%; top: 12%; }
      .title { font-size: 2rem; }
      .main { margin: 8px; padding: 16px 12px; }
      .status { display: none; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="orb"></div>

  <div class="shell">
    <div class="topbar">
      <div class="time" id="timeDisplay">9:25 PM</div>
      <button class="nav-btn" type="button">‹</button>
      <div class="address-bar"><span>⏺</span><span>ayaz-goat-arcade.github.io</span></div>
      <div class="status"><span class="status-dot"></span> Online</div>
    </div>

    <div class="tabs">
      <div class="tab active" data-section="games">🎮 Games</div>
      <div class="tab" data-section="apps">▣ Apps</div>
    </div>

    <main>
      <div class="quick-row">
        <span class="quick-item">✦</span>
        <span class="quick-item">＋</span>
        <span class="quick-item">▣</span>
        <span class="quick-item">⚙</span>
        <span class="quick-item">＋</span>
      </div>

      <h1 class="title" id="heading">games</h1>
      <p class="subtitle" id="subtitle">loaded 50+ games...</p>
      <input class="search" id="search" type="text" placeholder="find what you want..." />

      <section class="section active" id="games-section">
        <div class="section-label">Your Games</div>
        <div class="grid" id="gamesGrid"></div>
      </section>

      <section class="section" id="apps-section">
        <div class="section-label">Your Apps</div>
        <div class="grid">
          <a class="card app-youtube" href="https://www.youtube.com" target="_blank" rel="noopener">
            <span class="icon">▶</span>
            <span class="label">YouTube</span>
          </a>
          <a class="card app-tiktok" href="https://www.tiktok.com" target="_blank" rel="noopener">
            <span class="icon">♪</span>
            <span class="label">TikTok</span>
          </a>
          <a class="card app-discord" href="https://discord.com" target="_blank" rel="noopener">
            <span class="icon">💬</span>
            <span class="label">Discord</span>
          </a>
          <a class="card app-instagram" href="https://www.instagram.com" target="_blank" rel="noopener">
            <span class="icon">◎</span>
            <span class="label">Instagram</span>
          </a>
          <a class="card app-google" href="https://www.google.com" target="_blank" rel="noopener">
            <span class="icon">G</span>
            <span class="label">Google</span>
          </a>
          <a class="card app-twitch" href="https://www.twitch.tv" target="_blank" rel="noopener">
            <span class="icon">📺</span>
            <span class="label">Twitch</span>
          </a>
        </div>
      </section>

      <div class="footer-bar">
        <span>online users: 1455</span>
        <div class="footer-icons">
          <button type="button">⚙</button>
          <button type="button">◉</button>
        </div>
      </div>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">Game</h2>
        <button class="close-btn" id="closeModal" type="button">×</button>
      </div>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <script>
    // Game database with external iframe sources
    const GAMES = [
      // Built-in games
      { id: 'memory', name: 'Memory Match', icon: '🧩', class: 'game-memory', builtin: true },
      { id: 'reaction', name: 'Reaction Test', icon: '⚡', class: 'game-reaction', builtin: true },
      { id: 'guess', name: 'Secret Number', icon: '🎯', class: 'game-guess', builtin: true },
      { id: 'click', name: 'Click Challenge', icon: '👆', class: 'game-click', builtin: true },
      
      // Racing & Driving
      { name: 'Drift Hunters', icon: '🏎️', class: 'game-drift', url: 'https://math.canvas-lms.22web.org/' },
      { name: 'Racing Masters', icon: '🚗', class: 'game-racing', url: 'https://math.canvas-lms.22web.org/' },
      { name: 'Moto X3M', icon: '🏍️', class: 'game-racing', url: 'https://math.canvas-lms.22web.org/' },
      
      // Action/Boss Games
      { name: 'Boss Survival', icon: '👹', class: 'game-boss', url: 'https://math.canvas-lms.22web.org/' },
      { name: 'Combat Arena', icon: '⚔️', class: 'game-boss', url: 'https://math.canvas-lms.22web.org/' },
      { name: 'Bullet Hell', icon: '💥', class: 'game-boss', url: 'https://math.canvas-lms.22web.org/' },
      
      // Incremental/Clicker
      { name: 'Cookie Clicker', icon: '🍪', class: 'game-cookie', url: 'https://math.canvas-lms.22web.org/' },
      { name: 'Idle Miner', icon: '⛏️', class: 'game-cookie', url: 'https://math.canvas-lms.22web.org/' },
      { name: 'Universal Paperclips', icon: '📎', class: 'game-cookie', url: 'https://math.canvas-lms.22web.org/' },
      
      // Classic Arcade
      { name: 'Flappy Bird', icon: '🐦', class: 'game-flappy', url: 'https://math.canvas-lms.22web.org/' },
      { name: 'Snake', icon: '🐍', class: 'game-snake', url: 'https://math.canvas-lms.22web.org/' },

    ];

    const toggleSections = () => {
      const tabs = document.querySelectorAll('.tab');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const section = tab.dataset.section;
          tabs.forEach(t => t.classList.toggle('active', t === tab));

          const gamesSection = document.getElementById('games-section');
          const appsSection = document.getElementById('apps-section');
          gamesSection.classList.toggle('active', section === 'games');
          appsSection.classList.toggle('active', section === 'apps');

          const heading = document.getElementById('heading');
          const subtitle = document.getElementById('subtitle');
          if (section === 'games') {
            heading.textContent = 'games';
            subtitle.textContent = 'loaded 50+ games...';
          } else if (section === 'apps') {
            heading.textContent = 'apps';
            subtitle.textContent = 'online tools and app launchers';
          }
        });
      });
    };

    const searchInput = document.getElementById('search');
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      const activeSection = document.querySelector('.section.active');
      const cards = activeSection.querySelectorAll('.card');
      cards.forEach(card => {
        const txt = card.textContent.toLowerCase();
        card.style.display = txt.includes(q) ? 'flex' : 'none';
      });
    });

    function createStars() {
      const container = document.getElementById('stars');
      for (let i = 0; i < 120; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = (Math.random() * 3) + 's';
        container.appendChild(star);
      }
    }

    function updateTime() {
      const now = new Date();
      let hours = now.getHours() % 12 || 12;
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const suffix = now.getHours() >= 12 ? 'PM' : 'AM';
      document.getElementById('timeDisplay').textContent = `${hours}:${minutes} ${suffix}`;
    }

    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modalContent');
    const modalTitle = document.getElementById('modalTitle');
    document.getElementById('closeModal').addEventListener('click', () => {
      modal.classList.remove('open');
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });

    function openModal(title, html) {
      modalTitle.textContent = title;
      modalContent.innerHTML = html;
      modal.classList.add('open');
    }

    const games = {
      memory() {
        const symbols = ['🎮', '🎲', '🕹️', '👾', '🚀', '⭐', '🎯', '💎'];
        let deck = [...symbols, ...symbols].sort(() => Math.random() - 0.5);
        let flipped = [];
        let matches = 0;

        const html = `
          <p class="result">Find all 8 pairs.</p>
          <div class="board">
            ${deck.map((s, i) => `<button class="mem-card" data-index="${i}" type="button">?</button>`).join('')}
          </div>
          <p class="result" id="matchText">Matches: 0/8</p>
        `;
        openModal('Memory Match', html);

        const cards = [...document.querySelectorAll('.mem-card')];
        cards.forEach((card, index) => {
          card.addEventListener('click', () => {
            if (flipped.length >= 2) return;
            if (flipped.some(item => item.index === index)) return;

            card.textContent = deck[index];
            flipped.push({ index, card });

            if (flipped.length === 2) {
              const [a, b] = flipped;
              if (deck[a.index] === deck[b.index]) {
                matches++;
                a.card.classList.add('matched');
                b.card.classList.add('matched');
                flipped = [];
                document.getElementById('matchText').textContent = `Matches: ${matches}/8`;
              } else {
                setTimeout(() => {
                  a.card.textContent = '?';
                  b.card.textContent = '?';
                  flipped = [];
                }, 600);
              }
            }
          });
        });
      },

      reaction() {
        let ready = false;
        let startedAt = 0;
        openModal('Reaction Test', `
          <p class="result">Wait for green, then click.</p>
          <button class="big-btn" id="reactionButton" type="button">Start</button>
          <div class="result" id="reactionResult"></div>
        `);

        const btn = document.getElementById('reactionButton');
        const res = document.getElementById('reactionResult');

        btn.addEventListener('click', () => {
          if (!ready) {
            ready = true;
            btn.textContent = 'Wait...';
            btn.classList.remove('ready');
            res.textContent = '';
            setTimeout(() => {
              startedAt = performance.now();
              btn.textContent = 'CLICK!';
              btn.classList.add('ready');
            }, 1000 + Math.random() * 2200);
            return;
          }

          const delta = Math.round(performance.now() - startedAt);
          res.textContent = `⚡ ${delta}ms`;
          ready = false;
          btn.classList.remove('ready');
          btn.textContent = 'Again';
        });
      },

      guess() {
        const target = Math.floor(Math.random() * 100) + 1;
        let tries = 0;
        openModal('Secret Number', `
          <p class="result">Guess a number between 1 and 100.</p>
          <input class="input-number" id="guessInput" type="number" min="1" max="100" placeholder="1-100">
          <button class="action-btn" id="guessBtn" type="button">Guess</button>
          <div class="result" id="guessResult">Tries: 0</div>
        `);

        const btn = document.getElementById('guessBtn');
        btn.addEventListener('click', () => {
          const value = Number(document.getElementById('guessInput').value);
          tries++;
          if (value === target) {
            document.getElementById('guessResult').textContent = `Correct! ${target} was the answer in ${tries} tries.`;
            return;
          }
          document.getElementById('guessResult').textContent = value < target ? 'Too low — try higher.' : 'Too high — try lower.';
        });
      },

      click() {
        let score = 0;
        let ended = false;
        const endTime = Date.now() + 10000;
        openModal('Click Challenge', `
          <p class="result">Click as many times as possible in 10 seconds.</p>
          <button class="big-btn" id="clickBtn" type="button">0</button>
          <div class="result" id="clickResult">10 seconds left</div>
        `);

        const clickBtn = document.getElementById('clickBtn');
        const clickResult = document.getElementById('clickResult');
        clickBtn.addEventListener('click', () => {
          if (ended) return;
          score++;
          clickBtn.textContent = score;
        });

        const timer = setInterval(() => {
          const left = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
          clickResult.textContent = left > 0 ? `${left} seconds left` : `Final score: ${score}`;
          if (left <= 0) {
            ended = true;
            clearInterval(timer);
            clickBtn.disabled = true;
          }
        }, 100);
      }
    };

    function renderGamesGrid() {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = GAMES.map(game => {
        if (game.builtin) {
          return `
            <button class="card ${game.class}" type="button" data-game="${game.id}">
              <span class="icon">${game.icon}</span>
              <span class="label">${game.name}</span>
            </button>
          `;
        } else {
          return `
            <a class="card ${game.class}" href="${game.url}" target="_blank" rel="noopener">
              <span class="icon">${game.icon}</span>
              <span class="label">${game.name}</span>
            </a>
          `;
        }
      }).join('');

      document.querySelectorAll('[data-game]').forEach(btn => {
        btn.addEventListener('click', () => games[btn.dataset.game]());
      });
    }

    createStars();
    updateTime();
    toggleSections();
    renderGamesGrid();
    setInterval(updateTime, 60000);
  </script>
