<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ayaz's Arcade</title>
    <meta name="description" content="Ayaz's Arcade" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone-shell">
      <div class="status-bar">
        <span class="time">9:15</span>
        <div class="status-right" aria-label="status icons">
          <span class="signal signal-1"></span>
          <span class="signal signal-2"></span>
          <span class="signal signal-3"></span>
          <span class="battery" aria-hidden="true"></span>
        </div>
      </div>

      <div class="browser-frame">
        <div class="browser-toolbar" aria-label="browser controls">
          <span class="tiny-dot green"></span>
          <span class="tiny-dot yellow"></span>
          <span class="tiny-dot red"></span>
          <div class="toolbar-icons" aria-hidden="true">
            <span>⌂</span>
            <span>◎</span>
            <span>⚙</span>
          </div>
        </div>

        <main class="content-area">
          <h1 class="arcade-name">Ayaz's arcade</h1>

          <div class="social-row" aria-label="Social links">
            <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" class="social-item insta" aria-label="Instagram">
              <span>◎</span>
            </a>
            <a href="https://www.tiktok.com" target="_blank" rel="noopener noreferrer" class="social-item tiktok" aria-label="TikTok">
              <span>♪</span>
            </a>
            <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" class="social-item youtube" aria-label="YouTube">
              <span>▶</span>
            </a>
            <a href="https://discord.com" target="_blank" rel="noopener noreferrer" class="social-item discord" aria-label="Discord">
              <span>◈</span>
            </a>
          </div>

          <div id="welcomeModal" class="welcome-modal" role="dialog" aria-modal="true">
            <div class="popup-box">
              <button id="closeModal" class="popup-close" type="button" aria-label="Close popup">×</button>
              <div class="popup-message">
                <h2>welcome, mobile user!</h2>
                <p>since we have detected you as a mobile user, we have turned on Mobile Game Sizer!</p>
                <p>you can change this in settings if you so choose.</p>
                <button id="closePopup" class="popup-button" type="button">aight</button>
              </div>
            </div>
          </div>
        </main>

        <div class="bottom-bar">
          <button class="bottom-nav left-arrow" type="button" aria-label="Go back">‹</button>
          <div class="url-box">
            <button class="browser-icon" type="button" aria-label="Open menu">▣</button>
            <span class="url-text">is.22.web.org</span>
            <button class="refresh-icon" type="button" aria-label="Refresh">↻</button>
          </div>
          <button class="bottom-nav menu-btn" type="button" aria-label="More options">•••</button>
        </div>
      </div>
    </div>

    <script>
      const modal = document.getElementById('welcomeModal');
      const closeModalBtn = document.getElementById('closeModal');
      const closePopupBtn = document.getElementById('closePopup');

      function hideModal() {
        modal.style.display = 'none';
      }

      closeModalBtn.addEventListener('click', hideModal);
      closePopupBtn.addEventListener('click', hideModal);
      modal.addEventListener('click', (event) => {
        if (event.target === modal) hideModal();
      });
    </script>
  </body>
</html>
