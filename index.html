<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ayaz Arcade - 50+ Games</title>
  <style>
    :root {
      --bg-1: #050814;
      --bg-2: #0f172a;
      --panel: rgba(12, 18, 30, 0.74);
      --panel-strong: rgba(18, 25, 38, 0.92);
      --line: rgba(122, 246, 255, 0.16);
      --line-2: rgba(255, 255, 255, 0.12);
      --cyan: #7af6ff;
      --purple: #a58bff;
      --pink: #ff62c9;
      --green: #77f7b0;
      --red: #ff7575;
      --text: #edf6ff;
      --muted: rgba(237, 246, 255, 0.72);
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #020711;
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at 20% 20%, rgba(26, 65, 102, 0.5), transparent 25%),
        radial-gradient(circle at 80% 16%, rgba(120, 86, 255, 0.24), transparent 18%),
        linear-gradient(180deg, #020711 0%, #071420 35%, #020812 100%);
      position: relative;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      opacity: 0.8;
      animation: blink 3s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .orb {
      position: fixed;
      width: 180px;
      height: 180px;
      right: 8%;
      top: 8%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fffde7 0%, #f6ef9b 23%, #d8c55b 50%, #8e7d30 100%);
      box-shadow: 0 0 60px rgba(255, 239, 146, 0.35), inset -26px -14px 30px rgba(0,0,0,0.18);
      z-index: 0;
      animation: float 7s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1200px, 94vw);
      min-height: 86vh;
      margin: 3vh auto;
      background: rgba(7, 12, 22, 0.86);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0,0,0,0.6), 0 0 0 1px rgba(122,246,255,0.06);
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.02), rgba(255,255,255,0.01)),
        radial-gradient(circle, rgba(255,255,255,0.12) 0.8px, transparent 1.2px) 0 0 / 18px 18px;
      opacity: 0.5;
      pointer-events: none;
    }

    .topbar {
      position: relative;
      z-index: 2;
      height: 74px;
      background: rgba(28, 34, 46, 0.8);
      border-bottom: 1px solid var(--line-2);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 22px;
    }

    .time {
      min-width: 100px;
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.92);
    }

    .nav-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      border: 1px solid var(--line-2);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.9);
      font-size: 1.7rem;
      cursor: pointer;
    }

    .address-bar {
      flex: 1;
      max-width: 620px;
      height: 46px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 22px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.8);
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 0 16px;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
    }

    .status {
      min-width: 110px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.88);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(119,247,176,0.9);
    }

    .tabs {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 12px;
      padding: 10px 22px 0;
      overflow-x: auto;
    }

    .tab {
      min-width: 160px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom: none;
      border-radius: 16px 16px 0 0;
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.72);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tab.active {
      background: rgba(255,255,255,0.1);
      color: var(--text);
      border-color: rgba(122,246,255,0.2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .main {
      position: relative;
      z-index: 2;
      margin: 10px 24px 24px;
      background: rgba(15, 22, 34, 0.7);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 22px 20px 18px;
      min-height: 600px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .quick-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .quick-item {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      display: grid;
      place-items: center;
      font-size: 1.7rem;
      color: rgba(255,255,255,0.9);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
    }

    .title {
      text-align: center;
      margin: 22px 0 6px;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1;
      letter-spacing: -0.05em;
      font-weight: 900;
      text-shadow: 0 0 30px rgba(122,246,255,0.12);
    }

    .subtitle {
      text-align: center;
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      font-weight: 600;
    }

    .search {
      display: block;
      width: min(460px, 86%);
      height: 54px;
      margin: 22px auto 8px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.72);
      text-align: center;
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: inset 0 0 16px rgba(255,255,255,0.02);
    }

    .search::placeholder {
      color: rgba(255,255,255,0.4);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .section-label {
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin: 28px 0 14px;
      font-weight: 700;
    }

    .grid {
      width: min(920px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 24px rgba(0,0,0,0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 20px 28px rgba(0,0,0,0.28), 0 0 28px rgba(122,246,255,0.12);
    }

    .card .icon {
      font-size: 3.4rem;
      z-index: 1;
      text-shadow: 0 8px 24px rgba(0,0,0,0.28);
    }

    .card .label {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      z-index: 1;
      text-shadow: 0 4px 12px rgba(0,0,0,0.25);
      text-align: center;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 60%);
      opacity: 0.8;
    }

    .game-memory { background: linear-gradient(135deg, #67d6ff 0%, #4d5efb 100%); }
    .game-reaction { background: linear-gradient(135deg, #72e6ae 0%, #1ec98a 50%, #1486c8 100%); }
    .game-guess { background: linear-gradient(135deg, #ff8a61 0%, #ff5d6c 45%, #a92cc2 100%); }
    .game-click { background: linear-gradient(135deg, #d57dff 0%, #8b4dff 45%, #4b2d9a 100%); }
    .game-snake { background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%); }
    .game-pong { background: linear-gradient(135deg, #ffd54f 0%, #ffb300 100%); }
    .game-dino { background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%); }
    .game-tic { background: linear-gradient(135deg, #00bcd4 0%, #0097a7 100%); }
    .game-2048 { background: linear-gradient(135deg, #cddc39 0%, #afb42b 100%); }
    .game-cookie { background: linear-gradient(135deg, #8b4513 0%, #d2691e 100%); }
    .game-drift { background: linear-gradient(135deg, #ff6b6b 0%, #ff8e72 100%); }
    .game-boss { background: linear-gradient(135deg, #ffd93d 0%, #ff6b9d 100%); }
    .game-flappy { background: linear-gradient(135deg, #4fc3f7 0%, #2196f3 100%); }
    .game-racing { background: linear-gradient(135deg, #009688 0%, #00796b 100%); }
    .game-typing { background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%); }
    .game-bubble { background: linear-gradient(135deg, #673ab7 0%, #512da8 100%); }
    .game-breakout { background: linear-gradient(135deg, #ff5722 0%, #e64a19 100%); }
    .game-minesweeper { background: linear-gradient(135deg, #757575 0%, #424242 100%); }
    .game-arcade { background: linear-gradient(135deg, #7e57c2 0%, #5e35b1 100%); }

    .app-youtube { background: linear-gradient(135deg, #ff3e37 0%, #e4292a 50%, #8c1111 100%); }
    .app-tiktok { background: linear-gradient(135deg, #111827 0%, #1e293b 26%, #00d4ff 55%, #ff2d83 100%); }
    .app-discord { background: linear-gradient(135deg, #5563f7 0%, #4050d0 100%); }
    .app-instagram { background: linear-gradient(135deg, #ffd76b 0%, #fb9f42 18%, #f35f89 43%, #9058ff 100%); }
    .app-google { background: linear-gradient(135deg, #4285f4 0%, #34a853 30%, #fbbc05 60%, #ea4335 100%); }
    .app-twitch { background: linear-gradient(135deg, #7e5bff 0%, #4b2fa6 100%); }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 860px;
      margin: 28px auto 0;
      color: rgba(255,255,255,0.78);
      font-weight: 700;
      padding: 0 10px;
    }

    .footer-icons {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .footer-icons button {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      cursor: pointer;
      font-size: 1.1rem;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(2, 5, 12, 0.8);
      backdrop-filter: blur(8px);
      z-index: 20;
    }

    .modal.open {
      display: grid;
    }

    .modal-box {
      width: min(760px, 92vw);
      min-height: 340px;
      background: rgba(13, 20, 32, 0.96);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      box-shadow: 0 26px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(122,246,255,0.08);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(27,34,48,0.7);
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.02em;
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 1.6rem;
      cursor: pointer;
    }

    .modal-content {
      padding: 24px;
      text-align: center;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(60px, 1fr));
      gap: 12px;
      max-width: 420px;
      margin: 20px auto;
    }

    .mem-card {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      background: linear-gradient(135deg, rgba(64, 82, 121, 0.9), rgba(31, 52, 81, 0.9));
      display: grid;
      place-items: center;
      font-size: 2rem;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .mem-card:hover {
      transform: translateY(-2px);
      border-color: rgba(122,246,255,0.5);
    }

    .mem-card.matched {
      background: linear-gradient(135deg, rgba(70, 173, 117, 0.4), rgba(24, 65, 49, 0.8));
      border-color: rgba(119,247,176,0.6);
    }

    .big-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.18);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 2.4rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 22px auto;
      display: block;
    }

    .big-btn.ready {
      background: linear-gradient(135deg, rgba(119,247,176,0.35), rgba(122,246,255,0.25));
      border-color: rgba(119,247,176,0.6);
      box-shadow: 0 0 30px rgba(119,247,176,0.25);
    }

    .result {
      min-height: 30px;
      font-size: 1.06rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      margin-top: 10px;
    }

    .input-number {
      width: 220px;
      height: 50px;
      text-align: center;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 700;
      margin: 14px auto 10px;
      display: block;
    }

    .action-btn {
      padding: 12px 26px;
      border-radius: 12px;
      border: 1px solid rgba(122,246,255,0.2);
      background: linear-gradient(135deg, rgba(122,246,255,0.2), rgba(165,139,255,0.2));
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    canvas {
      display: block;
      margin: 16px auto;
      background: #0c1d2d;
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 16px;
    }

    .mini-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .mini-btn {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    @media (max-width: 860px) {
      .shell {
        width: 100vw;
        height: 100vh;
        margin: 0;
        border-radius: 0;
      }
      .tabs { padding-left: 12px; padding-right: 12px; }
      .tab { min-width: 120px; }
      .grid { grid-template-columns: repeat(2, minmax(100px, 1fr)); }
      .orb { width: 120px; height: 120px; right: 4%; top: 12%; }
      .title { font-size: 2rem; }
      .main { margin: 8px; padding: 16px 12px; }
      .status { display: none; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="orb"></div>

  <div class="shell">
    <div class="topbar">
      <div class="time" id="timeDisplay">9:25 PM</div>
      <button class="nav-btn" type="button">‹</button>
      <div class="address-bar"><span>⏺</span><span>ayaz-goat-arcade.github.io</span></div>
      <div class="status"><span class="status-dot"></span> Online</div>
    </div>

    <div class="tabs">
      <div class="tab active" data-section="games">🎮 Games</div>
      <div class="tab" data-section="apps">▣ Apps</div>
    </div>

    <main class="main">
      <div class="quick-row">
        <span class="quick-item">✦</span>
        <span class="quick-item">＋</span>
        <span class="quick-item">▣</span>
        <span class="quick-item">⚙</span>
        <span class="quick-item">＋</span>
      </div>

      <h1 class="title" id="heading">games</h1>
      <p class="subtitle" id="subtitle">loaded 50+ games...</p>
      <input class="search" id="search" type="text" placeholder="find what you want..." />

      <section class="section active" id="games-section">
        <div class="section-label">Your Games</div>
        <div class="grid" id="gamesGrid"></div>
      </section>

      <section class="section" id="apps-section">
        <div class="section-label">Your Apps</div>
        <div class="grid">
          <a class="card app-youtube" href="https://www.youtube.com" target="_blank" rel="noopener">
            <span class="icon">▶</span>
            <span class="label">YouTube</span>
          </a>
          <a class="card app-tiktok" href="https://www.tiktok.com" target="_blank" rel="noopener">
            <span class="icon">♪</span>
            <span class="label">TikTok</span>
          </a>
          <a class="card app-discord" href="https://discord.com" target="_blank" rel="noopener">
            <span class="icon">💬</span>
            <span class="label">Discord</span>
          </a>
          <a class="card app-instagram" href="https://www.instagram.com" target="_blank" rel="noopener">
            <span class="icon">◎</span>
            <span class="label">Instagram</span>
          </a>
          <a class="card app-google" href="https://www.google.com" target="_blank" rel="noopener">
            <span class="icon">G</span>
            <span class="label">Google</span>
          </a>
          <a class="card app-twitch" href="https://www.twitch.tv" target="_blank" rel="noopener">
            <span class="icon">📺</span>
            <span class="label">Twitch</span>
          </a>
        </div>
      </section>

      <div class="footer-bar">
        <span>online users: 1455</span>
        <div class="footer-icons">
          <button type="button">⚙</button>
          <button type="button">◉</button>
        </div>
      </div>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">Game</h2>
        <button class="close-btn" id="closeModal" type="button">×</button>
      </div>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <script>
    const GAMES = [
      { id: 'memory', name: 'Memory Match', icon: '🧩', className: 'game-memory', kind: 'local' },
      { id: 'reaction', name: 'Reaction Test', icon: '⚡', className: 'game-reaction', kind: 'local' },
      { id: 'guess', name: 'Secret Number', icon: '🎯', className: 'game-guess', kind: 'local' },
      { id: 'click', name: 'Click Challenge', icon: '👆', className: 'game-click', kind: 'local' },
      { id: 'snake', name: 'Snake', icon: '🐍', className: 'game-snake', kind: 'local' },
      { id: 'pong', name: 'Pong', icon: '🏓', className: 'game-pong', kind: 'local' },
      { id: 'dino', name: 'Dino Runner', icon: '🦖', className: 'game-dino', kind: 'local' },
      { id: 'tic', name: 'Tic-Tac-Toe', icon: '❌', className: 'game-tic', kind: 'local' },
      { id: '2048', name: '2048', icon: '2️⃣', className: 'game-2048', kind: 'local' },
      { id: 'cookie', name: 'Cookie Clicker', icon: '🍪', className: 'game-cookie', kind: 'local' },
      { id: 'drift', name: 'Drift Hunters', icon: '🏎️', className: 'game-drift', kind: 'external', url: 'https://www.crazygames.com/' },
      { id: 'racing', name: 'Racing Masters', icon: '🚗', className: 'game-racing', kind: 'external', url: 'https://www.crazygames.com/' },

      memory() {
        const symbols = ['🎮', '🎲', '🕹️', '👾', '🚀', '⭐', '🎯', '💎'];
        const deck = [...symbols, ...symbols].sort(() => Math.random() - 0.5);
        let flipped = [];

        const html = `
          <p class="result">Find all 8 pairs.</p>

        document.querySelectorAll('.mem-card').forEach((card, index) => {
          card.addEventListener('click', () => {
            if (flipped.length >= 2) return;
            if (flipped.some(item => item.index === index)) return;

            card.textContent = deck[index];
            flipped.push({ index, card });

            if (flipped.length === 2) {
              const [a, b] = flipped;
              if (deck[a.index] === deck[b.index]) {
                matches++;
                a.card.classList.add('matched');
                b.card.classList.add('matched');
                flipped = [];
                document.getElementById('matchText').textContent = `Matches: ${matches}/8`;

      snake() {
        const size = 18;
        const board = 360;
        const cell = board / size;
        let snake = [{ x: 9, y: 9 }, { x: 8, y: 9 }, { x: 7, y: 9 }];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = { x: 12, y: 7 };
        let isGameOver = false;

        openModal('Snake', `
          <p class="result">Use arrow keys to grow and survive.</p>
          <canvas id="snakeCanvas" width="360" height="360"></canvas>
          <div class="result" id="snakeStatus">Score: 0</div>
        `);

        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('snakeStatus');

        function placeFood() {
          food = {
            x: Math.floor(Math.random() * size),
            y: Math.floor(Math.random() * size)
          };
          if (snake.some(seg => seg.x === food.x && seg.y === food.y)) placeFood();
        }

        function draw() {
          ctx.clearRect(0, 0, board, board);
          ctx.fillStyle = '#0a1324';
          ctx.fillRect(0, 0, board, board);

          for (let x = 0; x < size; x++) {
            for (let y = 0; y < size; y++) {
              ctx.strokeStyle = 'rgba(255,255,255,0.05)';
              ctx.strokeRect(x * cell, y * cell, cell, cell);
            }
          }

          ctx.fillStyle = '#7af6ff';
          snake.forEach(seg => ctx.fillRect(seg.x * cell + 2, seg.y * cell + 2, cell - 4, cell - 4));

          ctx.fillStyle = '#ff6cc8';
          ctx.fillRect(food.x * cell + 3, food.y * cell + 3, cell - 6, cell - 6);
        }

        function step() {
          if (isGameOver) return;
          direction = nextDirection;
          const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

          if (head.x < 0 || head.y < 0 || head.x >= size || head.y >= size || snake.some(seg => seg.x === head.x && seg.y === head.y)) {
            isGameOver = true;
            status.textContent = 'Game over! Press reset to try again.';
            return;
          }

          snake.unshift(head);
          if (head.x === food.x && head.y === food.y) {
            placeFood();
            status.textContent = `Score: ${snake.length - 3}`;
          } else {
            snake.pop();
          }
          draw();
        }

        document.addEventListener('keydown', (event) => {
          const map = {
            ArrowUp: { x: 0, y: -1 },
            ArrowDown: { x: 0, y: 1 },
            ArrowLeft: { x: -1, y: 0 },
            ArrowRight: { x: 1, y: 0 }
          };
          const next = map[event.key];
          if (!next) return;
          if (direction.x + next.x === 0 && direction.y + next.y === 0) return;
          nextDirection = next;
        });

        draw();
        setInterval(step, 140);
      },

      pong() {
        const width = 480;
        const height = 300;
        const paddleHeight = 70;
        const paddleWidth = 12;
        const ballSize = 12;
        let leftY = height / 2 - paddleHeight / 2;
        let rightY = height / 2 - paddleHeight / 2;
        let ballX = width / 2;
        let ballY = height / 2;
        let ballVX = 4;
        let ballVY = 2.5;
        let leftScore = 0;
        let rightScore = 0;

        openModal('Pong', `
          <canvas id="pongCanvas" width="480" height="300"></canvas>
          <div class="result" id="pongScore">0 : 0</div>
          <div class="mini-row">
            <button class="mini-btn" type="button" id="pongReset">Reset</button>
          </div>
        `);

        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('pongScore');

        function resetBall() {
          ballX = width / 2;
          ballY = height / 2;
          ballVX = (Math.random() > 0.5 ? 1 : -1) * (4 + Math.random() * 1.5);
          ballVY = (Math.random() - 0.5) * 5;
        }

        function draw() {
          ctx.clearRect(0, 0, width, height);
          ctx.fillStyle = '#0d1b2a';
          ctx.fillRect(0, 0, width, height);
          ctx.fillStyle = '#eaf6ff';
          ctx.fillRect(20, leftY, paddleWidth, paddleHeight);
          ctx.fillRect(width - 32, rightY, paddleWidth, paddleHeight);
          ctx.fillRect(ballX - ballSize / 2, ballY - ballSize / 2, ballSize, ballSize);

          ctx.strokeStyle = '#8ecae6';
          ctx.beginPath();
          ctx.moveTo(width / 2, 0);
          ctx.lineTo(width / 2, height);
          ctx.stroke();
        }

        document.addEventListener('keydown', (event) => {
          if (event.key === 'w') leftY = Math.max(0, leftY - 20);
          if (event.key === 's') leftY = Math.min(height - paddleHeight, leftY + 20);
          if (event.key === 'ArrowUp') rightY = Math.max(0, rightY - 20);
          if (event.key === 'ArrowDown') rightY = Math.min(height - paddleHeight, rightY + 20);
        });

        function tick() {
          ballX += ballVX;
          ballY += ballVY;

          if (ballY <= 0 || ballY >= height) ballVY *= -1;
          if (ballX <= 32 && ballY >= leftY && ballY <= leftY + paddleHeight) {
            ballVX = Math.abs(ballVX);
          } else if (ballX >= width - 32 && ballY >= rightY && ballY <= rightY + paddleHeight) {
            ballVX = -Math.abs(ballVX);
          } else if (ballX < 0) {
            rightScore += 1;
            scoreEl.textContent = `${leftScore} : ${rightScore}`;
            resetBall();
          } else if (ballX > width) {
            leftScore += 1;
            scoreEl.textContent = `${leftScore} : ${rightScore}`;
            resetBall();
          }

          draw();
        }

        document.getElementById('pongReset').addEventListener('click', () => {
          leftScore = 0;
          rightScore = 0;
          scoreEl.textContent = '0 : 0';
          resetBall();
          draw();
        });

        resetBall();
        draw();
        setInterval(tick, 16);
      },

      dino() {
        const width = 500;
        const height = 180;
        let dinoY = 120;
        let velocity = 0;
        let jumping = false;
        let obstacles = [];
        let score = 0;

        openModal('Dino Runner', `
          <canvas id="dinoCanvas" width="500" height="180"></canvas>
          <div class="result" id="dinoStatus">Score: 0</div>
        `);

        const canvas = document.getElementById('dinoCanvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('dinoStatus');

        function resetGame() {
          dinoY = 120;
          velocity = 0;
          jumping = false;
          obstacles = [];
          score = 0;
          status.textContent = 'Score: 0';
        }

        function jump() {
          if (!jumping) {
            jumping = true;
            velocity = -10;
          }
        }

        document.addEventListener('keydown', (event) => {
          if (event.code === 'Space' || event.code === 'ArrowUp') jump();
        });

        function tick() {
          velocity += 0.55;
          dinoY += velocity;
          if (dinoY >= 120) {
            dinoY = 120;
            velocity = 0;
            jumping = false;
          }

          if (Math.random() < 0.02) {
            obstacles.push({ x: width, width: 18 + Math.random() * 24, height: 20 + Math.random() * 40 });
          }

          for (const obs of obstacles) {
            obs.x -= 4;
            if (obs.x + obs.width < 0) {
              obstacles.shift();
              score += 1;
              status.textContent = `Score: ${score}`;
            }

            const dinoX = 50;
            const dinoH = 30;
            if (dinoX + 30 > obs.x && dinoX < obs.x + obs.width && dinoY + dinoH > height - obs.height) {
              resetGame();
              return;
            }
          }

          draw();
        }

        function draw() {
          ctx.clearRect(0, 0, width, height);
          ctx.fillStyle = '#0c1d2d';
          ctx.fillRect(0, 0, width, height);

          ctx.fillStyle = '#7af6ff';
          ctx.fillRect(50, dinoY, 28, 30);
          ctx.fillStyle = '#ffb703';
          obstacles.forEach(obs => ctx.fillRect(obs.x, height - obs.height, obs.width, obs.height));
        }

        resetGame();
        draw();
        setInterval(tick, 20);
      },

      tic() {
        const board = Array(9).fill('');
        let currentPlayer = 'X';
        let winner = null;

        openModal('Tic-Tac-Toe', `
          <div class="board" id="ticBoard" style="grid-template-columns: repeat(3, 1fr); max-width: 300px;">
            ${Array.from({ length: 9 }).map(() => '<button class="mini-btn" type="button" style="width: 80px; height: 80px; font-size: 2rem;"> </button>').join('')}
          </div>
          <div class="result" id="ticStatus">Player X's turn</div>
        `);

        const cells = [...document.querySelectorAll('#ticBoard button')];
        const status = document.getElementById('ticStatus');

        function checkWinner() {
          const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
          for (const [a, b, c] of lines) {
            if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
          }
          return null;
        }

        cells.forEach((cell, index) => {
          cell.addEventListener('click', () => {
            if (board[index] || winner) return;
            board[index] = currentPlayer;
            cell.textContent = currentPlayer;
            winner = checkWinner();
            if (winner) {
              status.textContent = `Player ${winner} wins!`;
              return;
            }
            if (board.every(Boolean)) {
              status.textContent = 'Draw game!';
              return;
            }
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            status.textContent = `Player ${currentPlayer}'s turn`;
          });
        });
      },

      2048() {
        const size = 4;
        let board = Array.from({ length: size }, () => Array(size).fill(0));

        function emptyCells() {
          const cells = [];
          for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
              if (board[y][x] === 0) cells.push({ x, y });
            }
          }
          return cells;
        }

        function addRandomTile() {
          const cells = emptyCells();
          if (!cells.length) return;
          const cell = cells[Math.floor(Math.random() * cells.length)];
          board[cell.y][cell.x] = Math.random() < 0.9 ? 2 : 4;
        }

        function slideLine(line) {
          const values = line.filter(v => v !== 0);
          const merged = [];
          for (let i = 0; i < values.length; i++) {
            if (values[i] === values[i + 1]) {
              merged.push(values[i] * 2);
              i += 1;
            } else {
              merged.push(values[i]);
            }
          }
          while (merged.length < size) merged.push(0);
          return merged;
        }

        function move(direction) {
          const newBoard = Array.from({ length: size }, () => Array(size).fill(0));
          if (direction === 'left' || direction === 'right') {
            for (let y = 0; y < size; y++) {
              const line = [...board[y]];
              const moved = direction === 'left' ? slideLine(line) : slideLine([...line].reverse()).reverse();
              newBoard[y] = moved;
            }
          }
          if (direction === 'up' || direction === 'down') {
            for (let x = 0; x < size; x++) {
              const line = board.map(row => row[x]);
              const moved = direction === 'up' ? slideLine(line) : slideLine([...line].reverse()).reverse();
              for (let y = 0; y < size; y++) newBoard[y][x] = moved[y];
            }
          }
          if (JSON.stringify(board) !== JSON.stringify(newBoard)) {
            board = newBoard;
            addRandomTile();
            render();
          }
        }

        function render() {
          const html = board.map(row => row.map(value => `<div style="display:flex;align-items:center;justify-content:center;height:62px;border-radius:10px;background:${value ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)'};font-size:1.4rem;font-weight:800;">${value || ''}</div>`).join('')).join('');
          document.getElementById('game2048').innerHTML = html;
        }

        openModal('2048', `
          <div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:10px;max-width:300px;margin:0 auto;padding:8px;border-radius:14px;background:rgba(255,255,255,0.05);" id="game2048"></div>
          <div class="result">Use arrow keys to move.</div>
        `);

        addRandomTile();
        addRandomTile();
        render();

        document.addEventListener('keydown', (event) => {
          if (event.key === 'ArrowLeft') move('left');
          if (event.key === 'ArrowRight') move('right');
          if (event.key === 'ArrowUp') move('up');
          if (event.key === 'ArrowDown') move('down');
        });
      },

      cookie() {
        let total = 0;
        let cps = 0;

        openModal('Cookie Clicker', `
          <p class="result">Cookies: <span id="cookieTotal">0</span></p>
          <button class="big-btn" type="button" id="cookieBtn" style="font-size:3rem;">🍪</button>
          <div class="mini-row">
            <button class="mini-btn" type="button" id="cookieUpgrade">Auto Clicker (+1 CPS)</button>
          </div>
        `);

        const totalEl = document.getElementById('cookieTotal');
        const btn = document.getElementById('cookieBtn');
        const upgrade = document.getElementById('cookieUpgrade');

        btn.addEventListener('click', () => {
          total += 1;
          totalEl.textContent = total;
        });

        upgrade.addEventListener('click', () => {
          cps += 1;
          totalEl.textContent = total;
        });

        setInterval(() => {
          total += cps;
          totalEl.textContent = total;
        }, 1000);
      }
    };

    function renderGamesGrid() {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = GAMES.map((game) => {
        if (game.kind === 'local') {
          return `
            <button class="card ${game.className}" type="button" data-game="${game.id}">
              <span class="icon">${game.icon}</span>
              <span class="label">${game.name}</span>
            </button>
          `;
        }
        return `
          <a class="card ${game.className}" href="${game.url}" target="_blank" rel="noopener">
            <span class="icon">${game.icon}</span>
            <span class="label">${game.name}</span>
          </a>
        `;
      }).join('');

      document.querySelectorAll('[data-game]').forEach((button) => {
        button.addEventListener('click', () => {
          if (games[button.dataset.game]) games[button.dataset.game]();
        });
      });
    }

    const searchInput = document.getElementById('search');
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      const cards = document.querySelectorAll('#gamesGrid .card');
      cards.forEach((card) => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(q) ? 'flex' : 'none';
      });
    });

    createStars();
    updateTime();
    toggleSections();
    renderGamesGrid();
    setInterval(updateTime, 60000);
  </script>
</body>
</html>
