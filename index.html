<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ayaz Goat Arcade</title>
<style>
:root{--bg:#050814;--panel:#101a2c;--cyan:#7af6ff;--purple:#a58bff;--text:#edf6ff;--muted:#b8c4df}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 15%,#163c60,transparent 28%),radial-gradient(circle at 85% 12%,#4d3180,transparent 22%),linear-gradient(#020711,#071420 45%,#020812);color:var(--text);font:16px Arial;overflow-x:hidden}.stars{position:fixed;inset:0;pointer-events:none}.star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;animation:blink 3s infinite}@keyframes blink{50%{opacity:.15}}.orb{position:fixed;right:8%;top:7%;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fffde7,#d8c55b 55%,#665722);box-shadow:0 0 60px #f6ef9b55;animation:float 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-18px)}}.shell{position:relative;z-index:1;width:min(1200px,94vw);margin:3vh auto;background:#070c16dd;border:1px solid #7af6ff29;border-radius:22px;overflow:hidden;box-shadow:0 30px 90px #0009}.topbar{height:72px;display:flex;align-items:center;gap:14px;padding:12px 20px;background:#1c222ecc;border-bottom:1px solid #fff2}.time{min-width:90px;font-weight:bold}.address{flex:1;text-align:center;padding:13px;border-radius:24px;background:#ffffff0d;font-weight:bold}.status{color:#77f7b0;font-weight:bold}.tabs{display:flex;gap:10px;padding:10px 22px 0}.tab{padding:12px 35px;border:1px solid #fff2;border-bottom:0;border-radius:14px 14px 0 0;background:#ffffff0b;color:#b8c4df;font-weight:bold;cursor:pointer}.tab.active{color:white;background:#ffffff1a}.main{margin:10px 24px 24px;padding:24px;background:#0f1622b3;border:1px solid #fff1;border-radius:20px;max-height:78vh;overflow:auto}.title{text-align:center;margin:10px 0 5px;font-size:clamp(2.2rem,5vw,4rem)}.subtitle{text-align:center;color:var(--muted);margin:0}.search{display:block;width:min(500px,90%);margin:20px auto;padding:15px;border-radius:16px;border:1px solid #fff2;background:#ffffff0d;color:white;text-align:center;font-weight:bold}.section{display:none}.section.active{display:block}.label{text-align:center;text-transform:uppercase;letter-spacing:.15em;color:#ffffff80;margin:25px 0 15px;font-size:.85rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}.card{min-height:145px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1px solid #fff2;border-radius:17px;color:white;text-decoration:none;font-weight:bold;cursor:pointer;transition:.2s;box-shadow:0 10px 20px #0004}.card:hover{transform:translateY(-5px);filter:brightness(1.18)}.icon{font-size:2.8rem}.game{background:linear-gradient(135deg,#2776a8,#4d42b8)}.local{background:linear-gradient(135deg,#00a58c,#1671c5)}.action{background:linear-gradient(135deg,#ff725e,#a92cc2)}.race{background:linear-gradient(135deg,#ef5350,#ff9800)}.puzzle{background:linear-gradient(135deg,#673ab7,#2474d6)}.sport{background:linear-gradient(135deg,#009688,#00695c)}.app{background:linear-gradient(135deg,#4050d0,#7e5bff)}.footer{display:flex;justify-content:space-between;margin:25px auto 0;color:#ffffffb8;font-weight:bold}.modal{position:fixed;inset:0;display:none;place-items:center;background:#02050ccc;backdrop-filter:blur(8px);z-index:5}.modal.open{display:grid}.box{width:min(650px,92vw);background:#0d1420;border:1px solid #fff2;border-radius:20px;overflow:hidden}.head{display:flex;justify-content:space-between;padding:16px 20px;background:#1b2230;border-bottom:1px solid #fff2}.head h2{margin:0}.close{border:0;background:transparent;color:white;font-size:1.7rem;cursor:pointer}.content{text-align:center;padding:24px}.big{width:150px;height:150px;border-radius:50%;border:2px solid #fff3;background:#ffffff0d;color:white;font-size:2.5rem;font-weight:bold;cursor:pointer}.ready{background:#20bd8755!important}.result{min-height:28px;font-weight:bold;margin:12px}.mini{padding:10px 16px;border:1px solid #7af6ff55;background:#ffffff12;color:white;border-radius:10px;cursor:pointer}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:350px;margin:15px auto}.mem{aspect-ratio:1;border:1px solid #fff2;border-radius:10px;background:#1d3654;color:white;font-size:1.7rem;cursor:pointer}.scorebox{margin:15px auto;padding:14px;max-width:420px;border:1px solid #7af6ff33;border-radius:14px;background:#ffffff09}.scores{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:8px;color:#7af6ff}.score-reset{margin-top:8px;font-size:.8rem}@media(max-width:700px){.status{display:none}.main{margin:8px;padding:15px}.grid{grid-template-columns:repeat(2,minmax(100px,1fr))}.tab{padding:11px 20px}.address{font-size:.8rem}}
</style>
</head>
<body><div class="stars" id="stars"></div><div class="orb"></div><div class="shell"><div class="topbar"><div class="time" id="time">--:--</div><div class="address">⏺ ayaz-goat-arcade</div><div class="status">● Online</div></div><div class="tabs"><div class="tab active" data-section="games">🎮 Games</div><div class="tab" data-section="apps">▣ Apps</div></div><main class="main"><h1 class="title" id="title">games</h1><p class="subtitle" id="subtitle">50+ games with saved high scores</p><input class="search" id="search" placeholder="find what you want..."><section class="section active" id="games"><div class="label">Your Games</div><div class="grid" id="gameGrid"></div></section><section class="section" id="apps"><div class="label">Your Apps</div><div class="grid"><a class="card app" href="https://www.youtube.com" target="_blank"><span class="icon">▶</span>YouTube</a><a class="card app" href="https://www.tiktok.com" target="_blank"><span class="icon">♪</span>TikTok</a><a class="card app" href="https://discord.com" target="_blank"><span class="icon">💬</span>Discord</a><a class="card app" href="https://www.instagram.com" target="_blank"><span class="icon">◎</span>Instagram</a><a class="card app" href="https://www.google.com" target="_blank"><span class="icon">G</span>Google</a><a class="card app" href="https://www.twitch.tv" target="_blank"><span class="icon">📺</span>Twitch</a></div></section><div class="scorebox"><b>🏆 Local High Scores</b><div class="scores" id="scores"></div><button class="mini score-reset" id="resetScores">Reset saved scores</button></div><div class="footer"> <span>Scores save on this device</span><span>online users: 1455</span></div></main></div><div class="modal" id="modal"><div class="box"><div class="head"><h2 id="modalTitle">Game</h2><button class="close" id="close">×</button></div><div class="content" id="content"></div></div></div>
<script>
const gameNames=['Memory Match','Reaction Test','Secret Number','Click Challenge','Snake','Pong','Dino Runner','Tic-Tac-Toe','2048','Cookie Clicker','Drift Hunters','Boss Survival Arena','Cookie Clicker Classic','Racing Masters','Moto X3M','Bullet Hell','Idle Miner','Paperclips','Flappy Bird','Pac-Man','Breakout','Match 3','Basketball Legends','Mini Golf','Piano Tiles','Typing Master','Rhythm Game','Super Mario','Sonic Speed','Platformer Quest','Tower Defense','Chess','Checkers','Bubble Shooter','Space Shooter','Target Pro','Sudoku','Wordle','Simon Says','Agar.io','Slither.io','Bonk.io','Krunker','FPS Unblocked','Jump King','Vex','Happy Wheels','Death Run','Geometry Dash','Fireboy and Watergirl'];
const icons=['🧩','⚡','🎯','👆','🐍','🏓','🦖','❌','2️⃣','🍪','🏎️','👹','🍪','🚗','🏍️','💥','⛏️','📎','🐦','👾','🔶','🟪','🏀','⛳','🎹','⌨️','🎵','🍄','💨','🏃','🗼','♟️','🔴','🔵','🚀','🎯','🔢','📝','🎨','⭕','🎀','🎾','🔫','💣','⬆️','🏗️','🚲','👻','🎮','🔥'];
const localIds=['memory','reaction','guess','click','snake','pong','dino','tic','2048','cookie'];
const links=['https://www.crazygames.com/','https://www.coolmathgames.com/'];
const scoreKey='ayazArcadeHighScoresV1';let scores=JSON.parse(localStorage.getItem(scoreKey)||'{}');
const $=id=>document.getElementById(id),modal=$('modal'),content=$('content');
function saveScore(game,value,mode='high'){const old=scores[game];if(old===undefined||(mode==='low'?value<old:value>old)){scores[game]=value;localStorage.setItem(scoreKey,JSON.stringify(scores));renderScores();return true}return false}
function renderScores(){const shown=Object.entries(scores).slice(0,8);$('scores').innerHTML=shown.length?shown.map(([g,v])=>`<span>${g}: ${v}</span>`).join(''):'No scores yet — play a local game!'}
function open(title,html){$('modalTitle').textContent=title;content.innerHTML=html;modal.classList.add('open')}
$('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};$('resetScores').onclick=()=>{scores={};localStorage.removeItem(scoreKey);renderScores()};
function localGame(id,name){if(id==='memory')return memory(name);if(id==='reaction')return reaction(name);if(id==='guess')return guess(name);if(id==='click')return clicker(name);if(id==='tic')return tic(name);return simpleScore(name)}
function memory(name){let symbols=['🎮','🎲','🕹️','👾','🚀','⭐','🎯','💎'],deck=[...symbols,...symbols].sort(()=>Math.random()-.5),flipped=[],matches=0,moves=0;open(name,`<p class=result>Find all 8 pairs.</p><div class=board>${deck.map((_,i)=>`<button class=mem data-i=${i}>?</button>`).join('')}</div><p class=result id=gameResult>Matches: 0/8</p>`);document.querySelectorAll('.mem').forEach((b,i)=>b.onclick=()=>{if(flipped.length>1||flipped.some(x=>x.i===i)||b.classList.contains('matched'))return;b.textContent=deck[i];flipped.push({i,b});if(flipped.length===2){moves++;let[a,c]=flipped;if(deck[a.i]===deck[c.i]){a.b.classList.add('matched');c.b.classList.add('matched');matches++;flipped=[];$('gameResult').textContent=`Matches: ${matches}/8`;if(matches===8){saveScore(name,Math.max(1,1000-moves*10));$('gameResult').textContent=`Won in ${moves} moves! Best score: ${scores[name]}`}}else setTimeout(()=>{a.b.textContent=c.b.textContent='?';flipped=[]},600)}})}
function reaction(name){let start,armed=false,timer;open(name,`<p class=result>Wait for green, then click.</p><button class=big id=react>Start</button><p class=result id=gameResult></p>`);let b=$('react');b.onclick=()=>{if(armed){let ms=Math.round(performance.now()-start);saveScore(name,ms,'low');$('gameResult').textContent=`${ms} ms — best: ${scores[name]} ms`;armed=false;b.textContent='Again';b.classList.remove('ready');clearTimeout(timer)}else{armed=true;b.textContent='Wait...';timer=setTimeout(()=>{start=performance.now();b.textContent='CLICK!';b.classList.add('ready')},1000+Math.random()*2000)}}}
function guess(name){let target=Math.floor(Math.random()*100)+1,tries=0;open(name,`<p class=result>Guess a number from 1 to 100.</p><input class=input-number id=number type=number><button class=mini id=guess>Guess</button><p class=result id=gameResult>Tries: 0</p>`);$('guess').onclick=()=>{let n=Number($('number').value);if(!Number.isInteger(n)||n<1||n>100)return;$('gameResult').textContent=n===target?`Correct in ${++tries} tries! Best: ${scores[name]||'—'}`:(++tries, n<target?'Too low. Try higher.':'Too high. Try lower.');if(n===target)saveScore(name,tries,'low')}}
function clicker(name){let n=0,done=false,end=Date.now()+10000;open(name,`<p class=result>Click for 10 seconds.</p><button class=big id=click>0</button><p class=result id=gameResult>10 seconds left</p>`);$('click').onclick=()=>{if(!done){n++;$('click').textContent=n}};let t=setInterval(()=>{let left=Math.max(0,Math.ceil((end-Date.now())/1000));$('gameResult').textContent=left?`${left} seconds left`:`Final: ${n}`;if(!left){done=true;clearInterval(t);saveScore(name,n)}},100)}
function tic(name){let a=Array(9).fill(''),turn='X',won=false;open(name,`<div class=board style="grid-template-columns:repeat(3,1fr)">${a.map((_,i)=>`<button class=mem data-i=${i} style="font-size:2rem"> </button>`).join('')}</div><p class=result id=gameResult>Player X</p>`);let win=()=>[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(x=>a[x[0]]&&a[x[0]]===a[x[1]]&&a[x[1]]===a[x[2]]);document.querySelectorAll('.mem').forEach((b,i)=>b.onclick=()=>{if(a[i]||won)return;a[i]=turn;b.textContent=turn;won=win();if(won){$('gameResult').textContent=`${turn} wins!`;saveScore(name,1)}else{turn=turn==='X'?'O':'X';$('gameResult').textContent=`Player ${turn}`}})}
function simpleScore(name){open(name,`<p class=result>This game opens as an external arcade link.</p><a class=mini href="https://www.crazygames.com/" target="_blank" rel="noopener">Open game site</a>`)}
function renderGames(){let grid=$('gameGrid');grid.innerHTML=gameNames.map((name,i)=>{let id=localIds[i],cls=id?'local':(i%4===0?'race':i%4===1?'action':i%4===2?'puzzle':'sport');return id?`<button class="card ${cls}" data-local="${id}" data-name="${name}"><span class=icon>${icons[i]}</span>${name}</button>`:`<a class="card ${cls}" href="${links[i%links.length]}" target="_blank" rel="noopener"><span class=icon>${icons[i]}</span>${name}</a>`}).join('');document.querySelectorAll('[data-local]').forEach(b=>b.onclick=()=>localGame(b.dataset.local,b.dataset.name))}
$('search').oninput=()=>{let q=$('search').value.toLowerCase();document.querySelectorAll('#gameGrid .card').forEach(c=>c.style.display=c.textContent.toLowerCase().includes(q)?'flex':'none')};document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===tab));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===tab.dataset.section));$('title').textContent=tab.dataset.section;$('subtitle').textContent=tab.dataset.section==='games'?'50+ games with saved high scores':'online tools and app launchers'});for(let i=0;i<120;i++){let s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';$('stars').appendChild(s)}function time(){$('time').textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}time();setInterval(time,60000);renderGames();renderScores();
</script></body></html>
