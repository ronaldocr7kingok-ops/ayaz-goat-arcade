<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ayaz's Arcade</title>
    <meta name="description" content="Ayaz's arcade app launcher" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="screen-shell">
      <div class="top-strip">
        <div class="brand-badge">✦</div>
        <div class="tool-row">
          <button class="tool-btn" type="button" aria-label="Open utilities">＋</button>
          <button class="tool-btn" type="button" aria-label="Open apps">▣</button>
          <button class="tool-btn" type="button" aria-label="Open settings">⚙</button>
        </div>
      </div>

      <main class="app-panel">
        <h1 class="panel-title" id="panelTitle">apps</h1>

        <div class="search-box" aria-label="Search">find what you want...</div>

        <div class="tile-grid" id="tileGrid">
          <article class="app-tile tile-chatgpt" aria-label="ChatGPT">
            <div class="tile-logo chatgpt">◌</div>
          </article>

          <article class="app-tile tile-discord" aria-label="Discord">
            <div class="tile-logo discord">◉</div>
          </article>

          <article class="app-tile tile-nvidia" aria-label="NVIDIA">
            <div class="tile-logo nvidia">◍</div>
          </article>

          <article class="app-tile tile-android" aria-label="Android">
            <div class="tile-logo android">◐</div>
          </article>

          <article class="app-tile tile-movies" aria-label="Movies">
            <div class="tile-text movies">movies</div>
          </article>

          <article class="app-tile tile-tiktok" aria-label="TikTok">
            <div class="tile-logo tiktok">♪</div>
          </article>

          <article class="app-tile tile-youtube" aria-label="YouTube">
            <div class="tile-logo youtube">▶</div>
          </article>

          <article class="app-tile tile-vscode" aria-label="VS Code">
            <div class="tile-logo vscode">&lt;/&gt;</div>
          </article>
        </div>

        <div class="footer-status">
          <span>online users: 1455</span>
          <div class="footer-icons">
            <button class="mini-icon" type="button" aria-label="Settings">⚙</button>
            <button class="mini-icon" type="button" aria-label="Profile">◔</button>
          </div>
        </div>
      </main>
    </div>

    <script>
      const title = document.getElementById('panelTitle');
      const grid = document.getElementById('tileGrid');
      const toggleTitle = () => {
        const current = title.textContent.trim();
        title.textContent = current === 'apps' ? 'games' : 'apps';
        grid.classList.toggle('games-view', title.textContent === 'games');
      };

      const brandBadge = document.querySelector('.brand-badge');
      brandBadge.addEventListener('click', toggleTitle);
    </script>
  </body>
</html>
