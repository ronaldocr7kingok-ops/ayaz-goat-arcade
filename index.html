<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ayaz Arcade</title>
<style>
:root{--ink:#f2f6ff;--muted:#b8c2d8;--glass:rgba(28,34,49,.72);--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--ink);background:#050914}body{min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 50% 20%,#20264a 0,#0c1125 35%,#030711 78%)}
.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;animation:blink 3s infinite}@keyframes blink{50%{opacity:.15}}
.moon{position:fixed;z-index:0;right:7vw;top:7vh;width:clamp(100px,15vw,190px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fffde5 0 12%,#e9e1b0 40%,#a39b78 100%);box-shadow:0 0 45px rgba(255,247,190,.3),inset -20px -14px 30px rgba(0,0,0,.3);animation:float 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px)}}
.shell{position:relative;z-index:1;width:min(1180px,94vw);min-height:min(900px,94vh);margin:3vh auto;background:rgba(11,16,28,.88);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 25px 70px #000b}
.browser{height:72px;display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(35,37,46,.72);border-bottom:1px solid var(--line)}.time{font-weight:700;white-space:nowrap}.back{font-size:2rem}.address{flex:1;max-width:580px;margin:auto;height:42px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:9px;color:var(--muted);font-weight:700}.status{margin-left:auto;border:1px solid var(--line);border-radius:20px;padding:7px 11px;font-size:.75rem}.status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9bf0b2;margin-right:6px}
.tabs{display:flex;gap:10px;padding:10px 22px 0;overflow:auto}.tab{min-width:160px;padding:12px 18px;text-align:center;border-radius:15px 15px 0 0;background:rgba(255,255,255,.04);color:var(--muted);font-weight:700;cursor:pointer}.tab.active{background:rgba(255,255,255,.1);color:var(--ink)}
main{margin:10px 24px 24px;padding:20px;min-height:760px;border:1px solid var(--line);border-radius:18px;background:var(--glass)}.quick{display:flex;justify-content:center;gap:14px}.quick span{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.05);font-size:1.5rem}.heading{text-align:center;margin:25px 0 5px;font-size:clamp(3rem,6vw,5rem);line-height:1}.sub{text-align:center;color:var(--muted);font-size:1.2rem;margin:0}.search{display:block;width:min(440px,90%);margin:22px auto;height:52px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.06);color:var(--muted);padding:0 18px;text-align:center;font-size:1rem}.section{display:none}.section.active{display:block}.section-title{text-align:center;text-transform:lowercase;color:var(--muted);font-size:1rem;margin:24px 0 12px}.grid{width:min(850px,96%);margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:15px}.card{min-height:145px;border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-decoration:none;cursor:pointer;box-shadow:inset 0 0 20px #fff1,0 12px 22px #0004;transition:.2s}.card:hover{transform:translateY(-5px);filter:brightness(1.12)}.card b{font-size:3rem;text-shadow:0 5px 12px #0005}.card label{font-weight:700;font-size:1rem}.app-youtube{background:linear-gradient(135deg,#ff3b30,#c40000)}.app-tiktok{background:linear-gradient(135deg,#15151d,#03d9df,#fe2855)}.app-discord{background:#5865f2}.app-instagram{background:linear-gradient(135deg,#ffd451,#f22968,#6d28d9)}.app-google{background:#4285f4}.game-memory{background:linear-gradient(135deg,#71c7ff,#654cff)}.game-reaction{background:linear-gradient(135deg,#72e6ae,#2479d8)}.game-guess{background:linear-gradient(135deg,#ff8a61,#db3d73)}.game-click{background:linear-gradient(135deg,#b07aff,#ef4fbd)}
.footer{display:flex;justify-content:space-between;max-width:650px;margin:28px auto 0;color:var(--muted);font-weight:700}.modal{display:none;position:fixed;inset:0;z-index:5;background:#000b;place-items:center;padding:18px}.modal.open{display:grid}.box{width:min(620px,96vw);max-height:90vh;overflow:auto;padding:25px;border-radius:20px;background:#10182a;border:1px solid var(--line);text-align:center}.close{float:right;border:0;background:none;color:#fff;font-size:1.8rem;cursor:pointer}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px}.memory{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:#283658;color:#fff;font-size:2rem;cursor:pointer}.action{border:0;border-radius:12px;padding:13px 22px;background:linear-gradient(135deg,#7af6ff,#a58bff);font-weight:700;cursor:pointer}.big-action{width:180px;height:180px;border-radius:50%;font-size:2rem;background:#263752;color:#fff;border:2px solid #ffffff33;cursor:pointer}.big-action.ready{background:#39b976}.number{padding:12px;border-radius:10px;border:1px solid var(--line);background:#ffffff10;color:#fff;width:180px;font-size:1rem}
@media(max-width:650px){.shell{width:100vw;margin:0;border-radius:0}.browser{gap:8px}.address{font-size:.75rem}.status{display:none}main{margin:8px;padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.moon{right:3vw;top:12vh}}
</style>
</head>
<body>
<div class="stars" id="stars"></div><div class="moon"></div>
<div class="shell">
<header class="browser"><span class="time" id="time">9:25 PM</span><span class="back">‹</span><div class="address">◌ <span>ayaz-goat-arcade.github.io</span></div><span class="status"><i></i>online</span></header>
<nav class="tabs"><div class="tab active" data-section="games">🎮 Games</div><div class="tab" data-section="apps">▣ Apps</div></nav>
<main><div class="quick"><span>✦</span><span>＋</span><span>▣</span><span>⚙</span><span>＋</span></div><h1 class="heading" id="heading">games</h1><p class="sub" id="sub">loaded 4 games...</p><input class="search" id="search" placeholder="find what you want...">
<section class="section active" id="games"><h2 class="section-title">your games</h2><div class="grid">
<button class="card game-memory" data-game="memory"><b>🧩</b><label>Memory Match</label></button><button class="card game-reaction" data-game="reaction"><b>⚡</b><label>Reaction Test</label></button><button class="card game-guess" data-game="guess"><b>🎯</b><label>Secret Number</label></button><button class="card game-click" data-game="click"><b>👆</b><label>Click Challenge</label></button></div></section>
<section class="section" id="apps"><h2 class="section-title">your apps</h2><div class="grid"><a class="card app-youtube" href="https://www.youtube.com" target="_blank" rel="noopener"><b>▶</b><label>YouTube</label></a><a class="card app-tiktok" href="https://www.tiktok.com" target="_blank" rel="noopener"><b>♪</b><label>TikTok</label></a><a class="card app-discord" href="https://discord.com" target="_blank" rel="noopener"><b>💬</b><label>Discord</label></a><a class="card app-instagram" href="https://www.instagram.com" target="_blank" rel="noopener"><b>◎</b><label>Instagram</label></a><a class="card app-google" href="https://www.google.com" target="_blank" rel="noopener"><b>G</b><label>Google</label></a></div></section>
<div class="footer"><span>online users: 1455</span><span>⚙　◉</span></div></main></div>
<div class="modal" id="modal"><div class="box"><button class="close" id="close">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);const modal=$('#modal'),body=$('#modalBody'),title=$('#modalTitle');
for(let i=0;i<90;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';$('#stars').append(s)}
function clock(){const d=new Date();$('#time').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}clock();setInterval(clock,60000);
$$('.tab').forEach(t=>t.onclick=()=>{const id=t.dataset.section;$$('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');$$('.section').forEach(x=>x.classList.toggle('active',x.id===id));$('#heading').textContent=id;$('#sub').textContent=id==='games'?'loaded 4 games...':'your favorite apps...';$('#search').value='' });
$('#search').oninput=e=>{const q=e.target.value.toLowerCase();$$('.section.active .card').forEach(c=>c.style.display=c.textContent.toLowerCase().includes(q)?'flex':'none')};$('#close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
function show(t,html){title.textContent=t;body.innerHTML=html;modal.classList.add('open')}
$$('[data-game]').forEach(b=>b.onclick=()=>games[b.dataset.game]());
const games={memory(){const icons=['🎮','🎲','🕹️','👾','🚀','⭐','🎯','💎'];let deck=[...icons,...icons].sort(()=>Math.random()-.5),open=[],matches=0;show('Memory Match','<p>Find all 8 pairs.</p><div class="board">'+deck.map((_,i)=>`<button class="memory" data-i="${i}">?</button>`).join('')+'</div><p id="result">Matches: 0/8</p>');$$('.memory').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(open.some(x=>x.i===i)||open.length===2)return;b.textContent=deck[i];open.push({i,b});if(open.length===2){if(deck[open[0].i]===deck[open[1].i]){matches++;open.forEach(x=>x.b.disabled=true);open=[];$('#result').textContent=`Matches: ${matches}/8`}else setTimeout(()=>{open.forEach(x=>x.b.textContent='?');open=[]},600)}})},reaction(){show('Reaction Test','<p>Wait for green, then click!</p><button class="big-action" id="react">Start</button><p id="rout"></p>');let start,armed=false;$('#react').onclick=()=>{if(!armed){armed=true;$('#react').textContent='Wait...';setTimeout(()=>{start=performance.now();$('#react').classList.add('ready');$('#react').textContent='CLICK!'},1000+Math.random()*2000)}else{$('#rout').textContent=`Your time: ${Math.round(performance.now()-start)} ms`;armed=false;$('#react').classList.remove('ready');$('#react').textContent='Try again'}}},guess(){let n=Math.floor(Math.random()*100)+1,tr=0;show('Secret Number','<p>Guess a number from 1 to 100.</p><input class="number" id="num" type="number" min="1" max="100"><button class="action" id="guess">Guess</button><p id="gout">Tries: 0</p>');$('#guess').onclick=()=>{const v=+$('#num').value;tr++;$('#gout').textContent=v===n?`Correct in ${tr} tries! 🎉`:v<n?'Too low — try higher.':`Too high — try lower.`}},click(){let score=0;show('Click Challenge','<p>Click as many times as possible in 10 seconds.</p><button class="big-action" id="clicker">0</button><p id="cout">10 seconds left</p>');const end=Date.now()+10000;const timer=setInterval(()=>{let left=Math.max(0,Math.ceil((end-Date.now())/1000));$('#cout').textContent=left?`${left} seconds left`:`Final score: ${score}`;if(!left){clearInterval(timer);$('#clicker').disabled=true}},200);$('#clicker').onclick=()=>{if(Date.now()<end){score++;$('#clicker').textContent=score}}}};
</script></body></html>
